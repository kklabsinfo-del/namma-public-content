name: Automated Namma Thalapathy News Feed

on:
  # Exactly once per day: 00:30 UTC = 06:00 IST
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-news-feed
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect RSS articles for owner approval
        run: python scripts/update_news.py

      - name: Auto-publish only clearly eligible public-welfare sources
        run: python scripts/auto_publish_buzz.py

      - name: Commit changed pending and published feeds
        run: |
          if git diff --quiet -- pending_articles.json updates.json; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_articles.json updates.json
          git commit -m "chore(buzz): daily curated source-linked feed"
          git push
